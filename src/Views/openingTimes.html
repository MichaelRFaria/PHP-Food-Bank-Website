<html lang="en-GB">
  <head>

    <meta
      name="description"
      content="The official website for the Community Table food bank."
    />
    <meta name="keywords" content="Community Table, food bank, opening times" />

    <link rel="stylesheet" href="/website/assets/css/main.css" />
    <link rel="stylesheet" href="/website/assets/css/opening_times.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script defer src="/website/assets/js/main.js"></script>

    <title>{{ pageTitle }}</title>

    <div id="body_content">

      {{ include('sessionMessages.html') }}
      <div id="tables">

        <div>
          <h3>Next week:</h3>
          {{ include('openingTimesTable.html', { week: this_week, role: role }) }}
