<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Michael Faria" />
    <meta
      name="description"
      content="The official website for the Community Table food bank."
    />
    <meta
      name="keywords"
      content="Community Table, food bank, gallery, photos, pictures"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="/website/assets/css/main.css" />
    <link rel="stylesheet" href="/website/assets/css/gallery.css" />

    <script defer src="website/assets/js/main.js"></script>

    <title>{{ pageTitle }}</title>
  </head>

  <body>
    {{ include('header.html') }}
    
    <div id="gallery">
      <h2 id="subtitle">Our Gallery</h2>
      <h3>Our Food Bank</h3>
      <div class="gallery_imgs">
        <img
          width="400"
          src="/website/assets/marketing/food_1.jpg"
          alt="Image of the interior of the food bank, with crates of donations."
        />
        <img
          width="400"
          src="/website/assets/marketing/food_2.jpg"
          alt="Image of the interior of the food bank, focused on two crates with halal and pescatarian donations."
        />
        <img
          width="400"
          src="/website/assets/marketing/food_3.jpg"
          alt="Image of the interior of the food bank, with crates of donations."
        />
      </div>
      <div class="gallery_imgs">
        <img
          width="400"
          src="/website/assets/marketing/food_4.jpg"
          alt="Image of the interior of the food bank, with crates of fresh food donations."
        />
        <img
          width="400"
          src="/website/assets/marketing/tins_1.jpeg"
          alt="Image of the interior of the food bank, focused on tins of food."
        />
      </div>
      <h3>Our Volunteers</h3>
      <div class="gallery_imgs">
        <img
          width="400"
          src="/website/assets/volunteers/vol1.png"
          alt="Image of a volunteer stocking up a crate with donations."
        />
        <img
          width="400"
          src="/website/assets/volunteers/people_w_1.jpeg"
          alt="Image of a volunteer."
        />
        <img
          width="400"
          src="/website/assets/volunteers/vol_couple_1.jpeg"
          alt="Image of a pair of volunteers organising crates of donations."
        />
      </div>
      <div class="gallery_imgs">
        <img
          width="400"
          src="/website/assets/volunteers/people_boy_2.jpeg"
          alt="Image of volunteer in the back of a truck, filled with crates of donations."
        />
        <img
          width="400"
          src="/website/assets/volunteers/shelly.jpeg"
          alt="Image of a volunteer."
        />
      </div>
    </div>

    {{ include('footer.html') }}
  </body>
</html>
