<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Michael Faria" />
    <meta
      name="description"
      content="The official website for the Community Table food bank."
    />
    <meta name="keywords" content="Community Table, food bank, contact us" />

    <link rel="stylesheet" href="/website/assets/css/main.css" />
    <link rel="stylesheet" href="/website/assets/css/contact_us.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script defer src="website/assets/js/main.js"></script>
    <script defer src="website/assets/js/contact_us.js"></script>

    <title>Community Table - Contact Us</title>
  </head>

  <body>
    <div id="navbar">
      <h3><a href="../index.html">Main Page</a></h3>
      <h3>
        <a href="testimonials.html">Testimonials</a>
      </h3>
      <h3><a href="contact_us.html" id="selected">Contact Us</a></h3>
      <h3><a href="gallery.html">Gallery</a></h3>
    </div>

    <div id="title">
      <h1>Community Table</h1>
      <p>"A Table Set for All"</p>
    </div>

    <div id="body_content">
      <h2 id="subtitle">Send your message!</h2>
      <h4 id="instructions">Please enter your details below</h4>
      <form id="input_form">
        <div id="top_form">
          <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" />
          </div>
          <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" />
          </div>
        </div>
        <div id="bottom_form">
          <div>
            <label for="message">Message:</label>
            <textarea name="message" rows="8"></textarea>
          </div>
          <div>
            <button onclick="sendEmail()">Submit</button>
          </div>
        </div>
      </form>

      <div id="invisible_images">
        <img
          width="400"
          src="../assets/marketing/food_2.jpg"
          alt="Image of the interior of the food bank, with crates of donations."
        />
        <img
          width="400"
          src="../assets/logo/CommunityTable-logo.png"
          alt="Image of the Community Table logo."
        />
        <img
          width="400"
          src="../assets/volunteers/people_w_1.jpeg"
          alt="Image of the interior of the food bank, with crates of donations."
        />
      </div>
    </div>

    {{ include('footer.html') }}
  </body>
</html>
